<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 200px; padding: 12px; font-family: sans-serif; }
    .field { margin-bottom: 10px; }
    label { display: block; font-size: 12px; margin-bottom: 4px; font-weight: bold; }
    input[type="text"] { width: 100%; padding: 6px; box-sizing: border-box; font-family: monospace; }
    button { width: 100%; padding: 8px; cursor: pointer; background: #3692e7; color: white; border: none; border-radius: 4px; font-weight: bold; }
    button:hover { background: #2372c2; }
  </style>
</head>
<body>
  <div class="field">
    <label for="lightColor">Light Square Hex:</label>
    <input type="text" id="lightColor" placeholder="#eae9d2">
  </div>
  <div class="field">
    <label for="darkColor">Dark Square Hex:</label>
    <input type="text" id="darkColor" placeholder="#4b7399">
  </div>
  <button id="saveBtn">Apply Colors</button>

  <script src="popup.js"></script>
</body>
</html>
